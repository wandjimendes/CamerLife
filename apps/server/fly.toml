# Deploy from the repo root:  fly deploy --config apps/server/fly.toml --dockerfile apps/server/Dockerfile
# Then:  fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... CORS_ORIGINS=https://your-app.vercel.app
app = "cameroon-life-server"
primary_region = "cdg"   # Paris - closest region to Cameroon

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"
  NODE_ENV = "production"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = false   # keep rooms alive
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
